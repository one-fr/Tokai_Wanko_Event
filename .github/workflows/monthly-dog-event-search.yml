name: monthly-dog-event-search

on:
  schedule:
    # 毎月1日 9:00 JST（UTC 1日 0:00）
    # JST 6:00 に合わせるにはUTCで「前月末日21:00」の指定が必要だが、
    # 標準cronに月末日の表記がないため実現できない。1日に確実に走る9:00 JSTとする。
    - cron: '0 0 1 * *'
  workflow_dispatch:        # 手動実行用
    inputs:
      dry_run:
        description: 'カレンダー登録とevents.json更新を行わず、抽出結果の確認のみ行う'
        type: boolean
        default: false

jobs:
  collect-and-sync:
    runs-on: ubuntu-latest
    # 検索25回＋イベント件数ぶんの予測呼び出しで数分かかる。
    # 想定外に長引いた場合に無料枠を食い潰さないよう上限を設ける。
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run collection & sync script
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: npm start

      - name: Commit updated state
        if: inputs.dry_run != true
        run: |
          git config user.name "event-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/events.json
          git commit -m "chore: update events.json" || echo "変更なし"
          git push
